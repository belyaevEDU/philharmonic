name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run 'gofmt -w .' locally and commit the result."
            exit 1
          fi

  lint:
    name: golangci-lint + gci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Check import ordering
        run: |
          go install github.com/daixiang0/gci@latest
          unformatted="$(gci list .)"
          if [ -n "$unformatted" ]; then
            echo "The following files have improperly ordered imports:"
            echo "$unformatted"
            echo
            echo "Run 'gci write .' locally and commit the result."
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

  security:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run Gosec Security Checker
        run: gosec ./...
